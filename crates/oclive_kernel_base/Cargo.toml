[package]
name = "oclive_kernel_base"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "OCLive six-slot Base contracts with an optional character conformance profile"
publish = false

[lints]
workspace = true

[features]
default = ["character-profile"]
character-profile = ["dep:serde", "dep:serde_json"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
