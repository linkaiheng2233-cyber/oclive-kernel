[workspace]
members = ["crates/oclive_kernel_base", "examples/minimal-host", "examples/non-role-host"]
resolver = "2"

[workspace.package]
version = "0.1.0-preview.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/linkaiheng2233-cyber/oclive-kernel"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
