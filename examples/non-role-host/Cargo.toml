[package]
name = "oclive_non_role_host"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "A three-slot text-material Host without the character conformance profile"
publish = false

[lints]
workspace = true

[dependencies]
oclive_kernel_base = { path = "../../crates/oclive_kernel_base", default-features = false }
futures-lite = "2.6"

[dev-dependencies]
# Only the local-tokio example uses this runtime; it is not a Kernel dependency.
tokio = { version = "=1.53.3", default-features = false, features = ["rt"] }
