name: Kernel Base

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts-and-example:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7; reused source pin
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # reused source pin
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt
      - run: cargo test --locked --workspace
      - run: cargo test --locked --workspace --doc
      - run: cargo test --locked -p oclive_kernel_base --no-default-features
      - run: cargo test --locked -p oclive_kernel_base --no-default-features --doc
      - run: cargo test --locked -p oclive_kernel_base --no-default-features --features character-profile
      - run: cargo test --locked -p oclive_non_role_host
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo clippy --locked -p oclive_kernel_base --no-default-features --all-targets -- -D warnings
      - run: cargo clippy --locked -p oclive_non_role_host --all-targets -- -D warnings
      - run: cargo fmt --all -- --check
      - run: cargo run --locked -p oclive_minimal_host
      - run: cargo run --locked -p oclive_non_role_host
      - run: cargo tree --locked -p oclive_non_role_host --edges normal,build,features
